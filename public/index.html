<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termo Profissional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default" id="game-body">

  <header class="game-header">
    <h1 onclick="showScreen('gameplay-screen')">TERMO</h1>
    
    <div class="header-user-zone">
      <div class="avatar-container-clickable" onclick="showScreen('cosmetics-screen')">
        <img id="profile-avatar-img" src="assets/avatars/Dino.jpg" alt="Avatar" class="header-avatar">
        <img id="profile-border-img" src="" alt="Borda" class="header-border-overlay" style="display: none;">
      </div>
      <button onclick="logout()" class="btn-logout-small" title="Sair da Conta">✕</button>
    </div>
  </header>

  <div id="status"></div>

  <main id="gameplay-screen" class="screen screen-gameplay active">
    <div class="main-game-layout">
      
      <aside class="left-event-panel" id="left-event-panel">
        <h3 style="color: var(--text-accent); margin-top: 0;">Evento Ativo</h3>
        <div id="event-timer" style="font-size: 13px; margin-bottom: 12px;">Carregando evento...</div>
        <div id="roulette-display" style="font-weight: bold; margin-bottom: 12px; font-size: 14px;">🎰 1x BÔNUS</div>
        <button onclick="showScreen('ranking-screen')" style="width: 100%; padding: 10px; background: var(--tile-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; font-weight: bold; cursor: pointer;">VER RANKINGS</button>
      </aside>

      <section class="center-game-panel">
        
        <div id="boards-layout-container" class="boards-layout-container mode-1-active">
          </div>

        <div class="keyboard-wrapper">
          <div id="keyboard"></div>
        </div>

      </section>

    </div>
  </main>

  <main id="ranking-screen" class="screen ranking-main-container">
    <div class="ranking-board-wrapper">
      <table class="ranking-table">
        <thead>
          <tr>
            <th style="width: 15%;">Posição</th>
            <th style="width: 50%;">Jogador</th>
            <th style="width: 35%;">Pontuação (PDL)</th>
          </tr>
        </thead>
        <tbody id="ranking-body">
          </tbody>
      </table>
    </div>
    <button onclick="showScreen('gameplay-screen')" class="btn-global-action">Voltar ao Jogo</button>
  </main>

  <main id="cosmetics-screen" class="screen cosmetics-main-panel">
    
    <nav class="shop-tabs-sidebar">
      <button class="tab-button active-tab" onclick="changeShopTab('themes', this)">Themes</button>
      <button class="tab-button" onclick="changeShopTab('borders', this)">Borders</button>
      <button class="tab-button" onclick="changeShopTab('events', this)">Eventos</button>
      <button class="tab-button" onclick="changeShopTab('icons', this)">Icons</button>
    </nav>

    <section class="shop-vitrine-wrapper" id="shop-vitrine">
      </section>

    <div class="cosmetics-footer-controls">
      <div class="coins-display-box">
        🪙 Moedas: <span id="player-coins-value">0</span>
      </div>
      <button onclick="showScreen('gameplay-screen')" class="btn-global-action">Voltar</button>
    </div>

  </main>

  <script src="game.js"></script>
</body>
</html>
